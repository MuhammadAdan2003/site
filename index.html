<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Welcome to Cozy Space ✨</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />

    <style>
      /* Premium Luxury Mocha & Cream Palette Variables */
      :root {
        --bg: #1a0e21;
        --panel: #241130;
        --border: #402350;
        --primary: #ff8fd6;
        --cream: #ffe3f6;
      }

      body {
        background-color: var(--bg);
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        overflow: hidden;
      }

      /* Prevents mobile browser auto-zoom on input focus */
      .no-zoom-input {
        font-size: 16px !important;
      }

      /* Floating Login Hearts Ambient Background Animation */
      .bg-heart {
        position: absolute;
        bottom: -40px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.12;
        animation: floatUp 6s linear forwards;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.22;
        }
        90% {
          opacity: 0.22;
        }
        100% {
          transform: translateY(-105vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* Failed Dynamic Attempt Shake Vibrate Animation */
      .shake-anim {
        animation: shakeBox 0.4s ease-in-out;
      }
      @keyframes shakeBox {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-7px);
        }
        40%,
        80% {
          transform: translateX(7px);
        }
      }

      /* Success Blast Confetti Particles */
      .success-particle {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        animation: popOut 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }

      @keyframes popOut {
        0% {
          transform: translate(0, 0) scale(0.3);
          opacity: 1;
        }
        100% {
          transform: translate(var(--tw-x), var(--tw-y)) scale(1.3)
            rotate(var(--tw-r));
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4 relative">
    <div
      class="absolute top-1/4 left-1/4 w-72 h-72 bg-[var(--primary)]/5 rounded-full blur-[90px] pointer-events-none z-0"
    ></div>
    <div
      class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-[var(--cream)]/5 rounded-full blur-[90px] pointer-events-none z-0"
    ></div>

    <main
      class="relative w-full max-w-[380px] p-8 rounded-[2.8rem] bg-[var(--panel)] border border-[var(--border)] shadow-[0_35px_70px_rgba(0,0,0,0.7)] text-center z-10 transition-all duration-500 focus-within:border-[var(--primary)]/20"
    >
      <div
        class="relative mx-auto mb-5 w-16 h-16 flex items-center justify-center"
      >
        <div
          id="avatar-container"
          class="w-full h-full rounded-2xl bg-[var(--primary)]/10 border border-[var(--primary)]/30 flex items-center justify-center text-3xl transition-transform duration-300 transform hover:rotate-6"
        >
          🧸
        </div>
        <span class="absolute top-0 right-0 flex h-3 w-3">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[var(--primary)] opacity-60"
          ></span>
          <span
            class="relative inline-flex rounded-full h-3 w-3 bg-[var(--primary)]/80"
          ></span>
        </span>
      </div>

      <h1 class="text-2xl mb-3 font-black tracking-wide text-[var(--cream)] mb-1">
      Only For Hiba, with all my heart
      </h1>     
      <div class="space-y-4 text-left">
        <label
          class="block text-[9px] font-mono uppercase tracking-widest text-[var(--primary)] font-black pl-1.5 opacity-80"
          >Enter your Name</label
        >

        <div
          id="input-container"
          class="w-full bg-[var(--bg)] border-2 border-[var(--border)] rounded-2xl p-1.5 flex items-center focus-within:border-[var(--primary)] focus-within:shadow-[0_0_20px_rgba(255,143,214,0.06)] transition-all duration-300"
        >
          <div
            id="input-icon"
            class="pl-3.5 pr-2.5 text-[var(--primary)]/50 flex items-center justify-center transition-colors duration-300"
          >
            <i class="fa-solid fa-signature text-xs"></i>
          </div>

          <input
            type="text"
            id="name-input"
            class="w-full bg-transparent py-2.5 pr-4 text-white font-bold tracking-wide outline-none placeholder:text-white/10 font-sans no-zoom-input"
            placeholder="Apna naam likhen..."
            autocomplete="off"
            style="
              color: #ffffff !important;
              -webkit-text-fill-color: #ffffff !important;
            "
          />
        </div>

        <div
          id="status-wrapper"
          class="hidden transition-all duration-300 pl-1.5"
        >
          <p
            id="status-text"
            class="text-[11px] font-semibold flex items-center gap-2"
          ></p>
        </div>

        <button
          onclick="validateAndLogin()"
          class="w-full bg-[var(--primary)] hover:bg-[var(--cream)] text-[#1a0e21] font-black text-sm py-3.5 rounded-2xl transition-all duration-300 active:scale-[0.97] shadow-lg shadow-[var(--primary)]/5 flex items-center justify-center gap-2 mt-5 group"
        >
          Unlock Space
          <i
            class="fa-solid fa-heart text-xs transform group-hover:scale-125 transition-transform duration-300 animate-pulse"
          ></i>
        </button>
      </div>
    </main>

    <script>
      function createBackgroundHearts() {
        const heartCount = 6;
        for (let i = 0; i < heartCount; i++) {
          setTimeout(() => {
            const heart = document.createElement("i");
            heart.className =
              "fa-solid fa-heart bg-heart text-[var(--primary)]";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 3 + 5 + "s";
            heart.style.fontSize = Math.random() * 14 + 10 + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
          }, i * 1000);
        }
      }
      createBackgroundHearts();
      setInterval(createBackgroundHearts, 9000);

      // DYNAMIC CONDITIONAL LOGIC DEPLOYMENT PIPELINE
      function validateAndLogin() {
        const inputEl = document.getElementById("name-input");
        const containerEl = document.getElementById("input-container");
        const wrapperEl = document.getElementById("status-wrapper");
        const textEl = document.getElementById("status-text");
        const avatarEl = document.getElementById("avatar-container");
        const iconEl = document.getElementById("input-icon");

        // 1. Inputs ko completely wrap aur trim kar ke lowercase me set kar diya
        const nameValue = inputEl.value.trim().toLowerCase();

        // Reset dynamic layouts on each check loop
        containerEl.classList.remove(
          "shake-anim",
          "border-red-500/40",
          "border-green-500/40",
        );

        // STRICT VALIDATION: EQUALS ONLY TO "Hiba khan"
        if (nameValue === "Hiba khan") {
          // SUCCESS STATE ARCHITECTURE
          wrapperEl.classList.remove("hidden");
          textEl.className =
            "text-green-400 font-semibold flex items-center gap-2";
          textEl.innerHTML = `<i class="fa-solid fa-circle-check text-xs"></i> Access Granted!... 🌸`;

          containerEl.style.borderColor = "rgba(34, 197, 94, 0.4)"; // Forced CSS Green highlight
          iconEl.className =
            "pl-3.5 pr-2.5 text-green-400 flex items-center justify-center transition-colors duration-300";
          avatarEl.innerText = "✨";

          triggerSuccessBurst();

          setTimeout(() => {
            window.location.href = "main.html";
          }, 1250);
        } else {
          // FAILED COMPONENT RUNTIME (Triggered if anyone types just "Hiba" or anything else)
          wrapperEl.classList.remove("hidden");
          textEl.className =
            "text-red-400 font-semibold flex items-center gap-2";
          textEl.innerHTML = `<i class="fa-solid fa-circle-xmark text-xs"></i> Nhiii yaar sahi naam likhen... 🐾`;

          containerEl.classList.add("shake-anim");
          containerEl.style.borderColor = "rgba(239, 68, 68, 0.4)"; // Forced CSS Red highlight
          iconEl.className =
            "pl-3.5 pr-2.5 text-red-400 flex items-center justify-center transition-colors duration-300";
          avatarEl.innerText = "🙀";

          setTimeout(() => {
            containerEl.classList.remove("shake-anim");
          }, 400);
        }
      }

      // CONFETTI PHYSICS PARSE EMITTER ENGINE
      function triggerSuccessBurst() {
        const burstCount = 35;
        const emojis = ["💋", "💖", "✨", "🧸", "🌸", "👑"];

        for (let i = 0; i < burstCount; i++) {
          const particle = document.createElement("div");
          particle.className = "success-particle";
          particle.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];

          const angle = Math.random() * Math.PI * 2;
          const distance = Math.random() * 180 + 120;
          const x = Math.cos(angle) * distance + "px";
          const y = Math.sin(angle) * distance + "px";
          const rot = Math.random() * 360 + "deg";

          particle.style.setProperty("--tw-x", x);
          particle.style.setProperty("--tw-y", y);
          particle.style.setProperty("--tw-r", rot);

          particle.style.left = "50%";
          particle.style.top = "50%";
          particle.style.fontSize = Math.random() * (30 - 18) + 18 + "px";

          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 1200);
        }
      }

      document
        .getElementById("name-input")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") validateAndLogin();
        });
    </script>
  </body>
</html>
